imageservice.elasticsearch.index-name=imageservice-image-metadatas
%test.imageservice.elasticsearch.index-name=test-imageservice-image-metadatas

## Force a refresh after write to make sure that the data is available for search. Useful for testing.
%test.imageservice.elasticsearch.refresh-after-write=true

## Delete the index on start. ONLY turn this on for testing.
%test.imageservice.elasticsearch.delete-index-on-start=true

%prod.quarkus.elasticsearch.hosts=es:9200
%dev.quarkus.elasticsearch.hosts=0.0.0.0:9200
%test.quarkus.elasticsearch.hosts=0.0.0.0:9200

quarkus.http.cors=true
quarkus.http.cors.origins=*

data.image.dir=/images
data.new-image.subdir=community-data
%dev.data.image.dir=./sample_data/images

%dev.quarkus.log.category."ibb.api.imageservice".level=DEBUG
%test.quarkus.log.category."ibb.api.imageservice".level=DEBUG

quarkus.container-image.registry=docker.gitlab.gwdg.de
quarkus.container-image.group=ibb/api
